name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the "v" (defaults to the version in the card)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the version, and check every source agrees
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          card=$(grep -oP 'CARD_VERSION = "\K[^"]+' dist/heatpump-flow-card.js)
          pkg=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="$card"
          fi
          echo "version=$version card=$card package=$pkg"
          if [ "$version" != "$card" ] || [ "$version" != "$pkg" ]; then
            echo "::error::CARD_VERSION ($card), package.json ($pkg) and the release ($version) must match."
            exit 1
          fi
          # Keep a Changelog brackets the version when it links to a tag and
          # leaves it bare when there is none; both are the section for it.
          escaped=${version//./\\.}
          if ! grep -qE "^## \\[?${escaped}\\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # What actually changed, in the words of the changelog. GitHub's generated
      # list of merged pull requests is appended below it, so the release page
      # reads as prose first and as a commit log second.
      - name: Take the release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          escaped=${VERSION//./\\.}
          # anchored so that a "1.8" release could never take 1.8.2's section
          awk -v pat="^## \\[?${escaped}(\\]| |$)" '
            $0 ~ pat { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # the slice starts with the blank line under the heading
          awk 'NF { seen = 1 } seen' release-notes.md > release-notes.trimmed
          mv release-notes.trimmed release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no body for $VERSION."
            exit 1
          fi
          echo "--- release notes ---"
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          # On a tag push this is the tag; started by hand it creates the tag
          # at the commit that was checked out.
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: dist/heatpump-flow-card.js
          generate_release_notes: true
          make_latest: true
