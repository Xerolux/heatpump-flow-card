name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the card version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file=$(grep -oP 'CARD_VERSION = "\K[^"]+' dist/heatpump-flow-card.js)
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag card=$file package=$pkg"
          test "$tag" = "$file" && test "$tag" = "$pkg"
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/heatpump-flow-card.js
          generate_release_notes: true
