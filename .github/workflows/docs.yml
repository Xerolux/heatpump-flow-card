name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'dist/**'
      - 'tools/demo-hass.js'
      - 'tools/preview-config.js'
      - 'tools/build-site.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: Deploy the live demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/configure-pages@v5
      - name: Build the demo site
        run: node tools/build-site.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  wiki:
    name: Sync the wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did the wiki sources change?
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -q '^docs/wiki/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone the wiki
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" /tmp/wiki

      - name: Copy the pages over
        if: steps.changes.outputs.changed == 'true'
        run: |
          find /tmp/wiki -maxdepth 1 -type f -name '*.md' -delete
          cp docs/wiki/*.md /tmp/wiki/

      - name: Commit
        if: steps.changes.outputs.changed == 'true'
        working-directory: /tmp/wiki
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Wiki already up to date.'
          else
            git commit -m 'docs: sync wiki from docs/wiki [skip ci]'
            git push
          fi
