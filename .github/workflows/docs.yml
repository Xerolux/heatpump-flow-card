name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'dist/**'
      - 'tools/demo-hass.js'
      - 'tools/preview-config.js'
      - 'tools/build-site.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: Deploy the live demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/configure-pages@v6
        with:
          # Turns Pages on for the repository the first time this runs, so the
          # demo does not need a manual visit to Settings -> Pages.
          enablement: true
      - name: Build the demo site
        run: node tools/build-site.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  wiki:
    name: Sync the wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did the wiki sources change?
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -q '^docs/wiki/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone the wiki, or start it
        id: wiki
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if git clone "$url" /tmp/wiki 2>/dev/null; then
            echo 'Wiki cloned.'
          else
            # A wiki nobody has ever written to has no repository behind it,
            # and enabling the feature alone does not create one.
            echo 'No wiki repository yet - trying to start one.'
            mkdir -p /tmp/wiki
            git -C /tmp/wiki init -q -b master
            git -C /tmp/wiki remote add origin "$url"
          fi

      - name: Copy the pages over
        if: steps.changes.outputs.changed == 'true'
        run: |
          find /tmp/wiki -maxdepth 1 -type f -name '*.md' -delete
          cp docs/wiki/*.md /tmp/wiki/

      - name: Commit
        if: steps.changes.outputs.changed == 'true'
        working-directory: /tmp/wiki
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Wiki already up to date.'
            exit 0
          fi
          git commit -q -m 'docs: sync wiki from docs/wiki [skip ci]'
          if ! git push origin HEAD; then
            echo "::warning title=Wiki not published::Could not push to the wiki. GitHub creates the wiki repository only once a first page has been saved by hand: open the Wiki tab, create any page, save it, then re-run this workflow - it overwrites that page."
          fi
