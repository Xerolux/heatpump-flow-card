# Two heating circuits: radiators downstairs, underfloor heating upstairs.
type: custom:heatpump-flow-card
layout: dual
title: Heat pump and heating circuits
heatpump:
  name: Heat pump
  entity: switch.heat_pump
  state_entity: binary_sensor.compressor
  mode: sensor.hp_operating_mode
  power: sensor.hp_power
  cop: sensor.hp_cop
  flow_temp: sensor.hp_flow_temperature
  return_temp: sensor.hp_return_temperature
  outside_temp: sensor.outside_temperature
  compressor: sensor.compressor_load
buffer:
  name: Buffer tank
  top: sensor.buffer_top
  middle: sensor.buffer_middle
  bottom: sensor.buffer_bottom
  charge: sensor.buffer_charge
circuits:
  - name: Radiators, ground floor
    type: radiator
    entity: switch.circuit_a
    flow_temp: sensor.circuit_a_flow
    return_temp: sensor.circuit_a_return
    room_temp: sensor.living_room_temperature
    pump: binary_sensor.circuit_a_pump
    valve: sensor.circuit_a_mixer
  - name: Underfloor heating, first floor
    type: underfloor
    entity: switch.circuit_b
    flow_temp: sensor.circuit_b_flow
    return_temp: sensor.circuit_b_return
    room_temp: sensor.bathroom_temperature
    pump: binary_sensor.circuit_b_pump
    valve: sensor.circuit_b_mixer
