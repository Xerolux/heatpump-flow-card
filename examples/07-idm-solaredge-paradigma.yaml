# A real plant: an IDM heat pump, SolarEdge photovoltaics and a Paradigma
# (SystaSolar Aqua) solar thermal system, with two heating circuits, hot water
# and the second heat generator.
#
# Entity ids follow the device names of that installation - `alm6_15` for the
# IDM heat pump, `systasolar_aqua_s3` for the solar controller. Replace those
# prefixes with your own; the structure stays the same.
#
# Tap targets: the system mode and both circuit modes are `select` entities,
# hot water is a `water_heater`, the setpoints are `number` entities and the
# hot water boost is a `button`.
type: custom:heatpump-flow-card
layout: full
title: Heating plant

heatpump:
  name: IDM heat pump
  # tapping the panel offers the system modes
  entity: select.alm6_15_systembetriebsart
  mode: select.alm6_15_systembetriebsart
  # what it is actually doing right now - heating, hot water, defrosting
  status: sensor.alm6_15_warmepumpen_betriebsart
  state_entity: binary_sensor.alm6_15_verdichter_1
  power: sensor.alm6_15_elektrische_leistungsaufnahme_warmepumpe
  cop: sensor.alm6_15_jahresarbeitszahl_cop_momentan
  flow_temp: sensor.alm6_15_warmepumpen_vorlauftemperatur
  return_temp: sensor.alm6_15_warmepumpen_rucklauftemperatur
  outside_temp: sensor.alm6_15_aussentemperatur
  # flow rate through the heat sink, shown as a badge under the flow temperature
  flow_rate: sensor.alm6_15_durchfluss_warmesenke_b2
  # the bivalent stage: shown as its own row, glowing while it carries load
  aux_heat: binary_sensor.alm6_15_zweiter_warmeerzeuger_web
  aux_heat_power: sensor.alm6_15_e_heizstab_leistung

buffer:
  name: Buffer tank
  top: sensor.alm6_15_warmespeichertemperatur
  bottom: sensor.alm6_15_ladefuhler_temperatur
  # The AC-Thor in the buffer tank: it glows while it draws power, shows its
  # own temperature, and one tap operates its mode. Its power also appears as
  # a consumer on the energy bus.
  heater:
    entity: sensor.ac_thor_power
    threshold: 20
  heater_power: sensor.ac_thor_power
  heater_temp: sensor.ac_thor_temp1
  # The AC-Thor exposes several switches; these two are the ones that work.
  # switch.ac_thor_boost_mode, _boost_activate and _operation_mode read
  # `unavailable` on this firmware - do not point the card at them.
  heater_mode: switch.ac_thor_betriebsmodus

dhw:
  name: Hot water
  entity: water_heater.alm6_15
  mode: water_heater.alm6_15
  temp: sensor.alm6_15_trinkwassererwarmer_oben
  target_temp: number.alm6_15_warmwasser_sollwert
  pump: binary_sensor.alm6_15_warmwasser_zirkulationspumpe_web
  boost: button.alm6_15_warmwasser_boost_starten

pv:
  name: SolarEdge
  # all four inverters in one value - the card adds them up
  power:
    - sensor.solaredge_i1_ac_power
    - sensor.solaredge_i2_ac_power
    - sensor.solaredge_i3_ac_power
    - sensor.solaredge_i4_ac_power
  # several batteries average instead of adding, because it is a percentage
  battery:
    - sensor.solaredge_i1_b1_state_of_energy
  grid: sensor.solaredge_i1_m1_ac_power
  # The electrical side. As soon as one of these is set the card draws an
  # energy bus below the plant, and every node decides for itself which way
  # its own energy is travelling. If an arrow points the wrong way round,
  # add `invert: true` to that entity - meters disagree about which
  # direction counts as positive.
  # Verified against this plant: the battery reads +1504 W while its status is
  # B_STATUS_CHARGE, so positive is charging - the card's own convention.
  battery_power: sensor.solaredge_i1_b1_dc_power
  # Live-verified on this plant: the plain value is positive while exporting.
  grid_power:
    entity: sensor.solaredge_i1_m1_ac_power
    invert: true
  # openWB over MQTT. It numbers its charge points - this plant is on 6.
  wallbox: sensor.openwb_chargepoint_6_ladeleistung
  # UI template helper: inverter output minus export-positive grid power and wallbox.
  house: sensor.hausverbrauch

solar:
  name: Paradigma solar thermal
  # both ends of the solar circuit end up as badges on its pipes: what the
  # collector sends down, and what comes back up
  collector_temp: sensor.systasolar_aqua_s3_kollektor_temp
  return_temp: sensor.systasolar_aqua_s3_eintritt_temp
  pump: binary_sensor.systasolar_aqua_s3_solar_aktiv
  yield: sensor.systasolar_aqua_s3_tagesertrag

circuits:
  - name: Heating circuit A
    type: radiator
    entity: climate.alm6_15
    mode: select.alm6_15_betriebsart_hk_a
    flow_temp: sensor.alm6_15_vorlauftemperatur_hk_a
    room_temp: sensor.alm6_15_raumtemperatur_hk_a
    target_temp: number.alm6_15_raumsoll_heizen_normal_hk_a
    pump: binary_sensor.alm6_15_pumpe_heizkreis_a_web
    valve: sensor.alm6_15_mischer_heizkreis_a_web
  - name: Heating circuit D
    type: underfloor
    mode: select.alm6_15_hc_d_mode
    flow_temp: sensor.heizkreis_d_hc_d_flow_temp
    room_temp: sensor.heizkreis_d_hc_d_room_temp
    target_temp: number.alm6_15_hc_d_room_setpoint_heat_normal
    pump: binary_sensor.heizkreis_d_pumpe_heizkreis_d_web
    valve: sensor.heizkreis_d_mischer_heizkreis_d_web
