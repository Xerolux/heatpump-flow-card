# A whole dashboard view for the plant in 07-idm-solaredge-paradigma.yaml:
# an IDM heat pump, SolarEdge photovoltaics, a Paradigma solar thermal system
# and two heating circuits.
#
# Paste this under `views:` in the raw configuration editor
# (dashboard -> pencil -> three dots -> Raw configuration editor). Everything
# except the first card is a built-in Home Assistant card, so nothing else
# needs to be installed.
title: Heating
path: heating
icon: mdi:heat-pump
type: sections
max_columns: 3
sections:
  # ---------------------------------------------------------------- the plant
  - type: grid
    column_span: 3
    cards:
      - type: custom:heatpump-flow-card
        layout: full
        title: Heating plant
        heatpump:
          name: IDM heat pump
          entity: select.alm6_15_systembetriebsart
          mode: select.alm6_15_systembetriebsart
          status: sensor.alm6_15_warmepumpen_betriebsart
          state_entity: binary_sensor.alm6_15_verdichter_1
          power: sensor.alm6_15_elektrische_leistungsaufnahme_warmepumpe
          cop: sensor.alm6_15_jahresarbeitszahl_cop_momentan
          flow_temp: sensor.alm6_15_warmepumpen_vorlauftemperatur
          return_temp: sensor.alm6_15_warmepumpen_rucklauftemperatur
          flow_rate: sensor.alm6_15_durchfluss_warmesenke_b2
          outside_temp: sensor.alm6_15_aussentemperatur
          aux_heat: binary_sensor.alm6_15_zweiter_warmeerzeuger_web
          aux_heat_power: sensor.alm6_15_e_heizstab_leistung
        buffer:
          name: Buffer tank
          top: sensor.alm6_15_warmespeichertemperatur
          bottom: sensor.alm6_15_ladefuhler_temperatur
          # The AC-Thor in the buffer tank: it glows while it draws power, shows its
          # own temperature, and one tap operates its mode. Its power also appears as
          # a consumer on the energy bus.
          heater:
            entity: sensor.ac_thor_power
            threshold: 20
          heater_power: sensor.ac_thor_power
          heater_temp: sensor.ac_thor_temp1
          # The AC-Thor exposes several switches; these two are the ones that work.
          # switch.ac_thor_boost_mode, _boost_activate and _operation_mode read
          # `unavailable` on this firmware - do not point the card at them.
          heater_mode: switch.ac_thor_betriebsmodus
        dhw:
          name: Hot water
          entity: water_heater.alm6_15
          mode: water_heater.alm6_15
          temp: sensor.alm6_15_trinkwassererwarmer_oben
          target_temp: number.alm6_15_warmwasser_sollwert
          pump: binary_sensor.alm6_15_warmwasser_zirkulationspumpe_web
          boost: button.alm6_15_warmwasser_boost_starten
        pv:
          name: SolarEdge
          power:
            - sensor.solaredge_i1_ac_power
            - sensor.solaredge_i2_ac_power
            - sensor.solaredge_i3_ac_power
            - sensor.solaredge_i4_ac_power
          battery:
            - sensor.solaredge_i1_b1_state_of_energy
          grid: sensor.solaredge_i1_m1_ac_power
          # The electrical side. As soon as one of these is set the card draws an
          # energy bus below the plant, and every node decides for itself which way
          # its own energy is travelling. If an arrow points the wrong way round,
          # add `invert: true` to that entity - meters disagree about which
          # direction counts as positive.
          # Verified against this plant: the battery reads +1504 W while its status is
          # B_STATUS_CHARGE, so positive is charging - the card's own convention.
          battery_power: sensor.solaredge_i1_b1_dc_power
          # Live-verified on this plant: the plain SolarEdge value is positive while
          # exporting, whereas the card's convention is positive import.
          grid_power:
            entity: sensor.solaredge_i1_m1_ac_power
            invert: true
          # openWB over MQTT. It numbers its charge points - this plant is on 6.
          wallbox: sensor.openwb_chargepoint_6_ladeleistung
          # UI template helper: inverter output minus export-positive grid power and wallbox.
          house: sensor.hausverbrauch
        solar:
          name: Paradigma solar thermal
          collector_temp: sensor.systasolar_aqua_s3_kollektor_temp
          return_temp: sensor.systasolar_aqua_s3_eintritt_temp
          pump: binary_sensor.systasolar_aqua_s3_solar_aktiv
          yield: sensor.systasolar_aqua_s3_tagesertrag
        circuits:
          - name: Heating circuit A
            type: radiator
            entity: climate.alm6_15
            mode: select.alm6_15_betriebsart_hk_a
            flow_temp: sensor.alm6_15_vorlauftemperatur_hk_a
            room_temp: sensor.alm6_15_raumtemperatur_hk_a
            target_temp: number.alm6_15_raumsoll_heizen_normal_hk_a
            pump: binary_sensor.alm6_15_pumpe_heizkreis_a_web
            valve: sensor.alm6_15_mischer_heizkreis_a_web
          - name: Heating circuit D
            type: underfloor
            mode: select.alm6_15_hc_d_mode
            target_temp: number.alm6_15_hc_d_room_setpoint_heat_normal

  # -------------------------------------------------------------- heat pump
  - type: grid
    cards:
      - type: heading
        heading: Heat pump
        heading_style: title
      - type: gauge
        entity: sensor.alm6_15_jahresarbeitszahl_cop_momentan
        name: COP right now
        min: 0
        max: 7
        needle: true
        severity:
          green: 4
          yellow: 2.5
          red: 0
      - type: entities
        entities:
          - entity: sensor.alm6_15_warmepumpen_betriebsart
            name: Operating state
          - entity: binary_sensor.alm6_15_verdichter_1
            name: Compressor
          - entity: sensor.alm6_15_warmepumpen_spreizung
            name: Spread
          - entity: sensor.alm6_15_thermische_momentanleistung
            name: Thermal output
          - entity: sensor.alm6_15_elektrische_leistungsaufnahme_warmepumpe
            name: Electrical input
          - type: divider
          - entity: sensor.alm6_15_aktuelle_taktlaufzeit
            name: Current cycle
          - entity: sensor.alm6_15_warmepumpentakte_heute
            name: Cycles today
          - entity: sensor.alm6_15_abtauvorgange_heute
            name: Defrost cycles today
          - entity: sensor.alm6_15_zeit_seit_letztem_abtaustart
            name: Since the last defrost
      - type: history-graph
        hours_to_show: 24
        entities:
          - entity: sensor.alm6_15_warmepumpen_vorlauftemperatur
            name: Flow
          - entity: sensor.alm6_15_warmepumpen_rucklauftemperatur
            name: Return
          - entity: sensor.alm6_15_aussentemperatur
            name: Outside

  # ------------------------------------------------- hot water and circuits
  - type: grid
    cards:
      - type: heading
        heading: Hot water
        heading_style: title
      - type: thermostat
        entity: water_heater.alm6_15
      - type: entities
        entities:
          - entity: sensor.alm6_15_trinkwassererwarmer_oben
            name: Top
          - entity: sensor.alm6_15_trinkwassererwarmer_unten
            name: Bottom
          - entity: number.alm6_15_warmwasser_sollwert
            name: Setpoint
          - entity: binary_sensor.alm6_15_warmwasseranforderung
            name: Demand
          - entity: binary_sensor.alm6_15_warmwasser_zirkulationspumpe_web
            name: Circulation pump
          - entity: button.alm6_15_warmwasser_boost_starten
            name: Start a boost
          - entity: button.alm6_15_warmwasser_boost_abbrechen
            name: Cancel the boost
      - type: heading
        heading: Heating circuits
        heading_style: title
      - type: thermostat
        entity: climate.alm6_15
      - type: entities
        entities:
          - entity: select.alm6_15_betriebsart_hk_a
            name: Circuit A mode
          - entity: number.alm6_15_raumsoll_heizen_normal_hk_a
            name: Circuit A room setpoint
          - entity: sensor.alm6_15_sollvorlauftemperatur_hk_a
            name: Circuit A flow setpoint
          - type: divider
          - entity: select.alm6_15_hc_d_mode
            name: Circuit D mode
          - entity: number.alm6_15_hc_d_room_setpoint_heat_normal
            name: Circuit D room setpoint
          - entity: sensor.alm6_15_hc_d_active_mode
            name: Circuit D active mode

  # ------------------------------------------------------- sun and the rest
  - type: grid
    cards:
      - type: heading
        heading: Photovoltaics
        heading_style: title
      - type: entities
        entities:
          - entity: sensor.solaredge_i1_ac_power
            name: Inverter 1
          - entity: sensor.solaredge_i2_ac_power
            name: Inverter 2
          - entity: sensor.solaredge_i3_ac_power
            name: Inverter 3
          - entity: sensor.solaredge_i4_ac_power
            name: Inverter 4
          - type: divider
          - entity: sensor.solaredge_i1_b1_state_of_energy
            name: Battery
          - entity: sensor.alm6_15_pv_uberschuss
            name: Surplus
          - entity: sensor.alm6_15_hausverbrauch
            name: House consumption
      - type: heading
        heading: Solar thermal
        heading_style: title
      - type: entities
        entities:
          - entity: sensor.systasolar_aqua_s3_kollektor_temp
            name: Collector
          - entity: sensor.systasolar_aqua_s3_eintritt_temp
            name: Inlet
          - entity: sensor.systasolar_aqua_s3_speicher_unten
            name: Tank, bottom
          - entity: binary_sensor.systasolar_aqua_s3_solar_aktiv
            name: Solar active
          - entity: sensor.systasolar_aqua_s3_solar_leistung
            name: Output
          - entity: sensor.systasolar_aqua_s3_tagesertrag
            name: Yield today
          - entity: sensor.systasolar_aqua_s3_gesamtertrag
            name: Yield, total
      - type: heading
        heading: Second heat generator
        heading_style: title
      - type: entities
        entities:
          - entity: binary_sensor.alm6_15_zweiter_warmeerzeuger_web
            name: Engaged
          - entity: sensor.alm6_15_e_heizstab_leistung
            name: Element power
          - entity: sensor.alm6_15_bivalenz_betriebszustand
            name: Bivalence state
          - entity: binary_sensor.alm6_15_summenstorung
            name: Fault
          - entity: button.alm6_15_storungen_quittieren
            name: Acknowledge faults
