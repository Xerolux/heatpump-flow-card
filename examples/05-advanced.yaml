# Advanced options:
#   * the `direct-dhw` layout: no buffer tank, the heat pump feeds the
#     distributor directly
#   * four circuits, including a fan coil and a pool heat exchanger
#   * long form fields with their own name, unit, decimals and tap action
#   * a climate entity as the heat pump: tapping it opens more-info
#   * `zoom: false`, for a card that should not offer the full screen view
type: custom:heatpump-flow-card
layout: direct-dhw
title: Heating, in detail
animation: true
flow_speed: 1.4
temperature_colors: true
zoom: false          # removes the magnifier in the bottom right corner
heatpump:
  name: Air/water heat pump
  entity: climate.heat_pump
  mode: climate.heat_pump          # hvac_action is used automatically
  power:
    entity: sensor.hp_power
    name: Input
    decimals: 0
  cop:
    entity: sensor.hp_cop
    decimals: 2
  flow_temp: sensor.hp_flow_temperature
  return_temp: sensor.hp_return_temperature
  outside_temp: sensor.outside_temperature
  compressor: sensor.compressor_load
  power_threshold: 50                # below this the heat pump counts as idle
dhw:
  name: Hot water
  entity: switch.hot_water
  temp: sensor.dhw_temperature
  target_temp:
    entity: water_heater.hot_water
    attribute: temperature
    unit: "°C"
  tap_action:
    action: more-info
circuits:
  - name: Radiators, ground floor
    type: radiator
    flow_temp: sensor.circuit_a_flow
    return_temp: sensor.circuit_a_return
    room_temp:
      entity: climate.living_room
      attribute: current_temperature
      unit: "°C"
    pump: binary_sensor.circuit_a_pump
  - name: Underfloor heating, first floor
    type: underfloor
    flow_temp: sensor.circuit_b_flow
    return_temp: sensor.circuit_b_return
    pump: binary_sensor.circuit_b_pump
    valve: sensor.circuit_b_mixer
  - name: Fan coil, office
    type: fancoil
    flow_temp: sensor.circuit_c_flow
    pump: binary_sensor.circuit_c_pump
    entity: switch.circuit_c
    hold_action:
      action: navigate
      navigation_path: /lovelace/office
  - name: Pool heating
    type: pool
    flow_temp: sensor.pool_flow
    return_temp: sensor.pool_return
    room_temp: sensor.pool_temperature
    pump: switch.pool_pump
