# The complete plant: PV, solar thermal, heat pump, buffer tank, hot water and
# two heating circuits.
type: custom:heatpump-flow-card
layout: full
title: Heating plant
heatpump:
  name: Heat pump
  entity: switch.heat_pump
  state_entity: binary_sensor.compressor
  mode: select.system_mode        # a select becomes a mode picker
  power: sensor.hp_power
  cop: sensor.hp_cop
  flow_temp: sensor.hp_flow_temperature
  return_temp: sensor.hp_return_temperature
  outside_temp: sensor.outside_temperature
  compressor: sensor.compressor_load
pv:
  name: Photovoltaics
  power: sensor.pv_power
  battery: sensor.battery_soc          # a percentage, shown next to the name
  # Naming any of the four below draws the energy bus under the plant, so the
  # current is shown going where it really goes rather than always into the
  # heat pump. See 10-energy-bus.yaml for the whole story.
  battery_power: sensor.battery_power  # + charging, - discharging
  grid_power: sensor.grid_power        # + import, - export
  wallbox: sensor.wallbox_power
  house: sensor.house_consumption
solar:
  name: Solar thermal
  collector_temp: sensor.collector_temperature
  pump: binary_sensor.solar_pump
  yield: sensor.solar_yield
  return_temp: sensor.solar_return_temperature
buffer:
  name: Buffer tank
  top: sensor.buffer_top
  middle: sensor.buffer_middle
  bottom: sensor.buffer_bottom
  charge: sensor.buffer_charge
dhw:
  name: Hot water
  entity: switch.hot_water
  temp: sensor.dhw_temperature
  target_temp: number.dhw_setpoint        # tap it for a plus/minus stepper
  pump: binary_sensor.dhw_pump
  mode: select.dhw_mode        # tap it to pick an operating mode
  boost: button.dhw_boost      # tap it to press the button
circuits:
  - name: Radiators, ground floor
    type: radiator
    entity: switch.circuit_a
    flow_temp: sensor.circuit_a_flow
    return_temp: sensor.circuit_a_return
    room_temp: sensor.living_room_temperature
    pump: binary_sensor.circuit_a_pump
    valve: sensor.circuit_a_mixer
  - name: Underfloor heating, first floor
    type: underfloor
    mode: climate.circuit_b                # hvac modes + setpoint in one panel
    target_temp: climate.circuit_b
    entity: switch.circuit_b
    flow_temp: sensor.circuit_b_flow
    return_temp: sensor.circuit_b_return
    room_temp: sensor.bathroom_temperature
    pump: binary_sensor.circuit_b_pump
    valve: sensor.circuit_b_mixer
