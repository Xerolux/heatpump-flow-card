# Wired up for the IDM heat pump integration
# (https://github.com/Xerolux/idm-heatpump-hass).
#
# The entity id prefix follows the device name you gave the integration, so
# `idm_heatpump` below may be `navigator_10` or similar on your system - check
# Settings -> Devices & Services -> IDM Heatpump -> Entities.
#
# Everything with an arrow in the card can be operated directly:
#   * system mode and circuit mode are `select` entities -> option list
#   * the DHW target is a `number` -> plus/minus stepper
#   * a circuit bound to its `climate` entity -> hvac modes plus setpoint
#   * the one-time DHW charge is a `switch` -> toggled with one tap
type: custom:heatpump-flow-card
layout: full
title: IDM heat pump

heatpump:
  name: IDM Navigator
  entity: select.idm_heatpump_system_mode
  mode: select.idm_heatpump_system_mode
  power: sensor.idm_heatpump_current_heating_power
  # Thermal output without a heat meter: electrical draw times COP,
  # computed in the card.
  thermal_power:
    calculate: true
    power: sensor.idm_heatpump_power_consumption
    cop: sensor.idm_heatpump_calculated_cop
  cop: sensor.idm_heatpump_calculated_cop
  flow_temp: sensor.idm_heatpump_hp_flow_temperature
  return_temp: sensor.idm_heatpump_hp_return_temperature
  outside_temp: sensor.idm_heatpump_outdoor_temperature
  compressor: sensor.idm_heatpump_compressor_status_1
  # Faults: the panel's frame turns red, the wording lands in the status strip
  alarm: binary_sensor.idm_heatpump_hp_sum_alarm
  message: sensor.idm_heatpump_internal_message
  # Why it runs right now, when the integration offers it
  reason: sensor.idm_heatpump_demand_reason_web
  smart_grid: sensor.idm_heatpump_smart_grid_status
  cycles_today: sensor.idm_heatpump_analysis_heat_pump_cycles_today
  defrosts_today: sensor.idm_heatpump_analysis_defrost_starts_today

buffer:
  name: Buffer tank
  top: sensor.idm_heatpump_storage_tank_temperature
  bottom: sensor.idm_heatpump_cold_storage_temperature
  # An electric element in the tank - here a my-PV AC-Thor on its own
  # integration. Any one of these fields draws the rod; `heater` can be the
  # power sensor itself with a threshold in watts, and the element glows
  # while it draws.
  heater:
    entity: sensor.ac_thor_power
    threshold: 20
  heater_power: sensor.ac_thor_power
  heater_temp: sensor.ac_thor_temp1
  heater_mode: switch.ac_thor_betriebsmodus

dhw:
  name: Hot water
  entity: water_heater.idm_heatpump
  mode: water_heater.idm_heatpump
  temp: sensor.idm_heatpump_dhw_temp_top
  target_temp: number.idm_heatpump_dhw_setpoint
  # Litres through the fresh-water station while someone draws water - shown
  # as a badge under the tank's inlet, pulsing while the tap is open.
  flow_rate: sensor.idm_heatpump_hotwater_station_flow_web
  boost: switch.idm_heatpump_demand_onetime_dhw

pv:
  name: PV surplus
  power: sensor.idm_heatpump_pv_surplus

circuits:
  - name: Heating circuit A
    type: underfloor
    entity: climate.idm_heatpump_circuit_a
    mode: select.idm_heatpump_circuit_a_mode
    flow_temp: sensor.idm_heatpump_circuit_a_flow_temp
    room_temp: sensor.idm_heatpump_circuit_a_room_temp
    target_temp: number.idm_heatpump_circuit_a_room_setpoint_heat_normal
  - name: Heating circuit B
    type: radiator
    # Bound to the climate entity instead: one tap offers the hvac modes and
    # the room setpoint in the same little panel.
    entity: climate.idm_heatpump_circuit_b
    mode: climate.idm_heatpump_circuit_b
    target_temp: climate.idm_heatpump_circuit_b
    room_temp: climate.idm_heatpump_circuit_b
    flow_temp: sensor.idm_heatpump_circuit_b_flow_temp
