# A buffer tank with an electric element in it - here a my-PV AC-Thor that
# burns photovoltaic surplus into the tank - plus the heat pump's own second
# heat generator.
#
# The element is drawn inside the tank and glows while it draws power; tapping
# it operates the entity behind `heater`.
type: custom:heatpump-flow-card
layout: pv-dhw-dual
title: Heating with an immersion heater

heatpump:
  name: Heat pump
  entity: select.alm6_15_systembetriebsart
  mode: select.alm6_15_systembetriebsart
  status: sensor.alm6_15_warmepumpen_betriebsart
  state_entity: binary_sensor.alm6_15_verdichter_1
  power: sensor.alm6_15_elektrische_leistungsaufnahme_warmepumpe
  cop: sensor.alm6_15_jahresarbeitszahl_cop_momentan
  flow_temp: sensor.alm6_15_warmepumpen_vorlauftemperatur
  return_temp: sensor.alm6_15_warmepumpen_rucklauftemperatur
  outside_temp: sensor.alm6_15_aussentemperatur
  # flow rate through the heat sink, shown as a badge under the flow temperature
  flow_rate: sensor.alm6_15_durchfluss_warmesenke_b2
  aux_heat: binary_sensor.alm6_15_zweiter_warmeerzeuger_web
  aux_heat_power: sensor.alm6_15_e_heizstab_leistung

buffer:
  name: Buffer tank
  top: sensor.alm6_15_warmespeichertemperatur
  bottom: sensor.alm6_15_ladefuhler_temperatur
  # The AC-Thor. `heater` decides whether the element glows - a power sensor
  # counts as running above zero - and its name is printed under the element.
  # `heater_mode` takes over the tap, so one tap operates the mode.
  heater:
    entity: sensor.ac_thor_power
    name: AC-Thor
  heater_power: sensor.ac_thor_power
  heater_temp: sensor.ac_thor_temp1
  heater_mode: switch.ac_thor_betriebsmodus
  # a one-off push instead:
  # heater_mode: switch.ac_thor_boost_aktivieren
  # Not these three - they read `unavailable` on this firmware, and a field
  # pointed at one of them stays empty: switch.ac_thor_boost_mode,
  # switch.ac_thor_boost_activate, switch.ac_thor_operation_mode.

dhw:
  name: Hot water
  entity: water_heater.alm6_15
  mode: water_heater.alm6_15
  temp: sensor.alm6_15_trinkwassererwarmer_oben
  target_temp: number.alm6_15_warmwasser_sollwert
  boost: button.alm6_15_warmwasser_boost_starten
  # an AC-Thor on the hot water tank instead would go here:
  # heater: sensor.ac_thor_power
  # heater_power: sensor.ac_thor_power
  # heater_temp: sensor.ac_thor_temp1

pv:
  name: SolarEdge
  power:
    - sensor.solaredge_i1_ac_power
    - sensor.solaredge_i2_ac_power
    - sensor.solaredge_i3_ac_power
    - sensor.solaredge_i4_ac_power
  battery:
    - sensor.solaredge_i1_b1_state_of_energy
  # With the electrical side named, the element in the tank shows up as a
  # consumer on the energy bus below the plant - which is where its power
  # actually comes from.
  battery_power: sensor.solaredge_i1_b1_dc_power
  grid_power:
    entity: sensor.solaredge_i1_m1_ac_power
    invert: true
  wallbox: sensor.openwb_chargepoint_6_ladeleistung
  house: sensor.hausverbrauch

circuits:
  - name: Heating circuit A
    type: radiator
    mode: select.alm6_15_betriebsart_hk_a
    flow_temp: sensor.alm6_15_vorlauftemperatur_hk_a
    room_temp: sensor.alm6_15_raumtemperatur_hk_a
    pump: binary_sensor.alm6_15_pumpe_heizkreis_a_web
  - name: Heating circuit D
    type: underfloor
    mode: select.alm6_15_hc_d_mode
    flow_temp: sensor.heizkreis_d_hc_d_flow_temp
    room_temp: sensor.heizkreis_d_hc_d_room_temp
    target_temp: number.alm6_15_hc_d_room_setpoint_heat_normal
    pump: binary_sensor.heizkreis_d_pumpe_heizkreis_d_web
    valve: sensor.heizkreis_d_mischer_heizkreis_d_web
