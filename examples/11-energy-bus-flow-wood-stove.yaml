# The light energy bus, custom consumers, a house reading without the heat
# pump - and a wood stove as a second, hand-fed heat source.
#
#   electrics_style: flow   draws the bus as round nodes on one thin solid
#                           line, like the Tesla app or power-flow-card-plus:
#                           dots whose speed follows the watts, segments that
#                           only carry current when the balance really flows
#                           through them, the heat pump on the line as one of
#                           the round nodes.
#
#   pv.consumers            big loads of your own - air conditioning, a dryer,
#                           a server rack - get their own nodes instead of
#                           hiding inside the house reading. Up to four.
#
#   pv.house.subtract       a house meter that already contains the heat pump
#                           would count it twice on the bus. Naming it here
#                           leaves it out of the house reading; `wallbox` and
#                           `consumers` are the other values it understands.
#
#   wood_stove              a second heat source you feed and light by hand -
#                           a wood stove, a pellet boiler. It plumbs into the
#                           buffer on its own pair of pipes, and it is off
#                           unless named.
#
#   heatpump.fan: false     for a brine-to-water or water-to-water unit: no
#                           outdoor fan is drawn - two brine ports instead -
#                           and defrost vapour, an air-side symptom, stays
#                           hidden.
#
# This example is a hybrid plant: an air-to-water heat pump, a wood stove for
# the cold days, and a house meter that includes both the heat pump and the
# air conditioning.
type: custom:heatpump-flow-card
layout: full
title: Heating plant with a wood stove
electrics_style: flow

heatpump:
  name: Heat pump
  entity: select.system_mode
  mode: select.system_mode
  status: sensor.hp_operating_state
  state_entity: binary_sensor.compressor
  power: sensor.hp_power
  # The COP calculated in the card: thermal output over electrical draw.
  # Both are normalized to watts, so kW against W comes out right.
  cop:
    calculate: true
    thermal_power: sensor.hp_heat_output
    power: sensor.hp_power
    decimals: 2
  flow_temp: sensor.hp_flow_temperature
  return_temp: sensor.hp_return_temperature
  outside_temp: sensor.outside_temperature
  compressor: sensor.compressor_load
  # Sole/Wasser - the unit has no outdoor fan.
  fan: false
  # Refrigerant circuit, for installations that report the loop temperatures.
  ref_discharge_temp: sensor.hp_ref_discharge_gas
  ref_condenser_temp: sensor.hp_ref_condenser
  ref_liquid_temp: sensor.hp_ref_liquid_line
  ref_suction_temp: sensor.hp_ref_suction_gas

buffer:
  name: Buffer tank
  top: sensor.buffer_top
  middle: sensor.buffer_middle
  bottom: sensor.buffer_bottom
  charge: sensor.buffer_charge

dhw:
  name: Hot water
  entity: switch.hot_water
  temp: sensor.dhw_temperature
  target_temp: number.dhw_setpoint
  pump: binary_sensor.dhw_pump

pv:
  name: Photovoltaics
  power:
    - sensor.pv_inverter_1
    - sensor.pv_inverter_2
  battery: sensor.battery_soc
  battery_power: sensor.battery_power
  grid_power:
    entity: sensor.grid_power
    invert: true          # this meter counts export as positive
  wallbox: sensor.wallbox_power
  house:
    entity: sensor.house_power
    # the meter includes the heat pump and the air conditioning
    subtract: [heatpump, consumers]
  consumers:
    - entity: sensor.airco_power
      name: Airco
    - entity: sensor.dryer_power

wood_stove:
  name: Wood stove
  entity: binary_sensor.wood_stove
  state_entity: binary_sensor.wood_stove_burning
  status: sensor.wood_stove_status
  flow_temp: sensor.wood_stove_flow
  return_temp: sensor.wood_stove_return

circuits:
  - name: Radiators, ground floor
    type: radiator
    entity: switch.circuit_a
    flow_temp: sensor.circuit_a_flow
    return_temp: sensor.circuit_a_return
    room_temp: sensor.living_room_temperature
    target_temp: climate.circuit_a
    pump: binary_sensor.circuit_a_pump
    valve: sensor.circuit_a_mixer
    mode: climate.circuit_a
  - name: Underfloor heating, first floor
    type: underfloor
    entity: switch.circuit_b
    flow_temp: sensor.circuit_b_flow
    return_temp: sensor.circuit_b_return
    room_temp: sensor.bathroom_temperature
    pump: binary_sensor.circuit_b_pump
    valve: sensor.circuit_b_mixer
