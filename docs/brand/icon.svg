<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Heat Pump Flow Card">
  <title>Heat Pump Flow Card</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12283e" />
      <stop offset="1" stop-color="#060d15" />
    </linearGradient>
    <linearGradient id="loop" gradientUnits="userSpaceOnUse" x1="128" y1="384" x2="384" y2="128">
      <stop offset="0" stop-color="#1d4ed8" />
      <stop offset="0.28" stop-color="#38bdf8" />
      <stop offset="0.52" stop-color="#94a3b8" />
      <stop offset="0.74" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#ef4444" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#plate)" />
  <circle cx="256" cy="256" r="186" fill="url(#glow)" />

  <!-- the circuit: flow hot at the top, return cold at the bottom -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#loop)" stroke-width="42" />
  <g fill="#ffffff" opacity="0.92">
    <circle cx="256" cy="106" r="9.5" />
    <circle cx="362" cy="150" r="9.5" />
    <circle cx="406" cy="256" r="9.5" />
    <circle cx="362" cy="362" r="9.5" />
    <circle cx="256" cy="406" r="9.5" />
    <circle cx="150" cy="362" r="9.5" />
    <circle cx="106" cy="256" r="9.5" />
    <circle cx="150" cy="150" r="9.5" />
  </g>

  <!-- the heat pump: fan on its disc -->
  <circle cx="256" cy="256" r="104" fill="#0a1622" />
  <g transform="translate(256 256)" fill="#e8f4ff">
    <path transform="rotate(0)" d="M 0 -3 C 30 -60 77 -56 86 -13 C 52 0 21 11 0 3 Z" />
    <path transform="rotate(120)" d="M 0 -3 C 30 -60 77 -56 86 -13 C 52 0 21 11 0 3 Z" />
    <path transform="rotate(240)" d="M 0 -3 C 30 -60 77 -56 86 -13 C 52 0 21 11 0 3 Z" />
  </g>
  <circle cx="256" cy="256" r="17" fill="#0a1622" />
  <circle cx="256" cy="256" r="17" fill="none" stroke="#e8f4ff" stroke-width="5" />
</svg>
